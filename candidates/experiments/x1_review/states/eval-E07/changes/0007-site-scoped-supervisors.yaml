request: "Site-scoped supervisors and a new manager role (maintenance, applied after E05)"
interpretation: >-
  staff.role gains the value 'manager'; sofia (id 1) becomes manager (site North kept), tomas and
  yara stay supervisors, no other record changes. A manager has, on every site, every right a
  supervisor had before. "Site supervisor of X" means role supervisor and user.site == X, where X is
  the asset's site for a work order and the record's own site for an asset or part. Work orders:
  readable by managers, supervisors and technicians of the asset's site, the requester and the
  assignee; supervisor rights (assign, cancel from open/assigned/in_progress, PATCH of
  title/description/priority while unfinished) apply to managers and own-site supervisors only,
  everyone else falls back to the requested_by rights (title/description while open, cancel while
  open) or 403. Part usages and time entries follow the work-order read rule. Create: managers any
  site; everybody else (supervisors included) only for an asset of their own site (403 before 400;
  a missing/unknown asset is left to the 400 check). Assets and parts: managers unrestricted;
  supervisors may create only with site == own site (a body without site, or site null, is left to
  the required-field 400), may PATCH/DELETE only records whose current site is their own, and a
  PATCH that sends a site other than their own (null is left to the 400) is 403. Staff create,
  PATCH, DELETE: managers only. Reading staff/assets/parts unchanged. UI forms follow the rules
  (staff/new for managers; assets/new and parts/new for managers and supervisors).
ops:
  - change_field: {entity: staff, name: role, values: [requester, technician, supervisor, manager]}
  - update_records: {entity: staff, where: "record.id == 1 and record.username == 'sofia'", set: {role: "'manager'"}}

  - set_rule: {entity: staff, rule: create, expr: "user.role == 'manager'"}
  - set_rule: {entity: staff, rule: update, expr: "user.role == 'manager'"}
  - set_rule: {entity: staff, rule: delete, expr: "user.role == 'manager'"}

  - set_rule: {entity: assets, rule: create, expr: "user.role == 'manager' or (user.role == 'supervisor' and (record.site is None or record.site == user.site))"}
  - set_rule: {entity: assets, rule: update, expr: "user.role == 'manager' or (user.role == 'supervisor' and first(assets, id=record.id).site == user.site and ('site' not in input or input['site'] is None or input['site'] == user.site))"}
  - set_rule: {entity: assets, rule: delete, expr: "user.role == 'manager' or (user.role == 'supervisor' and record.site == user.site)"}

  - set_rule: {entity: parts, rule: create, expr: "user.role == 'manager' or (user.role == 'supervisor' and (record.site is None or record.site == user.site))"}
  - set_rule: {entity: parts, rule: update, expr: "user.role == 'manager' or (user.role == 'supervisor' and first(parts, id=record.id).site == user.site and ('site' not in input or input['site'] is None or input['site'] == user.site))"}
  - set_rule: {entity: parts, rule: delete, expr: "user.role == 'manager' or (user.role == 'supervisor' and record.site == user.site)"}

  - set_rule: {entity: work_orders, rule: read, expr: "user.role == 'manager' or record.requested_by == user or record.assignee == user or (user.role in ['supervisor', 'technician'] and user.site == record.asset.site)"}
  - set_rule: {entity: work_orders, rule: create, expr: "user.role == 'manager' or record.asset is None or record.asset.site == user.site"}
  - set_rule: {entity: work_orders, rule: update, expr: "user.role == 'manager' or (user.role == 'supervisor' and record.asset.site == user.site) or (record.requested_by == user and 'priority' not in input)"}
  - set_rule: {entity: work_orders, rule: update_guard, expr: "record.status in ['open', 'assigned', 'in_progress'] if (user.role == 'manager' or (user.role == 'supervisor' and record.asset.site == user.site)) else record.status == 'open'"}
  - change_action:
      entity: work_orders
      name: assign
      allow: "user.role == 'manager' or (user.role == 'supervisor' and record.asset.site == user.site)"
  - change_action:
      entity: work_orders
      name: cancel
      allow: "user.role == 'manager' or (user.role == 'supervisor' and record.asset.site == user.site) or record.requested_by == user"
      guard: "record.status in ['open', 'assigned', 'in_progress'] if (user.role == 'manager' or (user.role == 'supervisor' and record.asset.site == user.site)) else record.status == 'open'"

  - set_rule: {entity: part_usages, rule: read, expr: "user.role == 'manager' or record.work_order.requested_by == user or record.work_order.assignee == user or (user.role in ['supervisor', 'technician'] and user.site == record.work_order.asset.site)"}
  - set_rule: {entity: time_entries, rule: read, expr: "user.role == 'manager' or record.work_order.requested_by == user or record.work_order.assignee == user or (user.role in ['supervisor', 'technician'] and user.site == record.work_order.asset.site)"}

