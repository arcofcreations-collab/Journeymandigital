request: "Time logging replaces the labor figure entered at completion (maintenance, applied after E03)"
interpretation: >-
  New entity time_entries (work_order ref, technician ref staff, minutes int, logged_at datetime,
  note text or null), all fields system; read rule = the work order read rule restated on
  record.work_order (lists contain only readable entries, direct access 403); create/update/delete
  are False so POST/PATCH/DELETE give 403 for everyone. New work_orders action
  log_time(minutes: int required, note: text optional): allow = current assignee (403), guard =
  status in_progress (409), then params are validated (400: minutes must be a JSON integer, booleans,
  decimals and strings are rejected by the int param type; note must be text or null; unknown keys
  are rejected) and a fail effect enforces 1 <= minutes <= 600 (400). It creates one time entry with
  technician = caller and logged_at = now and emits nothing. work_orders.labor_minutes becomes a
  computed field: sum of minutes over the order's time entries, null when it has none (computed, so a
  create/PATCH body containing it is still 400). complete now takes only resolution (non-empty text;
  labor_minutes or any other key is 400); its guard additionally requires at least one time entry
  (409), so precedence is 403 (not assignee), 409 (not in_progress or no time entry), 400 (body). The
  work_completed payload keeps its five keys with labor_minutes = the derived total at completion.
  The UI forms follow allow+guard: log_time for the assignee of an in_progress order; complete only
  when it is allowed now (assignee, in_progress, >= 1 entry). Cancel is untouched, so entries and
  labor_minutes remain. Migration: before labor_minutes becomes computed, every order with a non-null
  stored labor_minutes (all 39 are completed orders with an assignee and completed_at) gets one time
  entry (technician = assignee, including the inactive umar; minutes = labor_minutes;
  logged_at = completed_at; note = "migrated"), ids 1..39 in ascending work order id, so every
  derived labor_minutes equals the former stored value (null where it was null). New entries get
  ids from 40.
ops:
  - add_entity:
      name: time_entries
      fields:
        work_order: {type: ref, ref: work_orders, required: true, system: true}
        technician: {type: ref, ref: staff, required: true, system: true}
        minutes: {type: int, required: true, system: true}
        logged_at: {type: datetime, required: true, system: true}
        note: {type: text, system: true}
      rules:
        read: >-
          user.role == 'supervisor' or record.work_order.requested_by == user or record.work_order.assignee == user
          or (user.role == 'technician' and user.site == record.work_order.asset.site)
        create: "False"
        update: "False"
        delete: "False"

  - add_records:
      entity: time_entries
