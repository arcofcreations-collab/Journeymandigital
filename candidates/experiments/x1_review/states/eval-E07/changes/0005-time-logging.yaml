        - {id: 38, work_order: 67, technician: 9, minutes: 105, logged_at: "2026-02-24T13:00:00", note: migrated}
        - {id: 39, work_order: 70, technician: 13, minutes: 240, logged_at: "2026-02-27T12:00:00", note: migrated}

  - change_field:
      entity: work_orders
      name: labor_minutes
      computed: "sum(e.minutes for e in find(time_entries, work_order=record)) if count(time_entries, work_order=record) > 0 else None"

  - add_action:
      entity: work_orders
      name: log_time
      params:
        minutes: {type: int, required: true}
        note: {type: text}
      allow: "record.assignee == user"
      guard: "record.status == 'in_progress'"
      guard_message: "'time can only be logged on a work order in progress'"
      effects:
        - fail: "'minutes must be an integer from 1 to 600'"
          status: 400
          when: "params.minutes < 1 or params.minutes > 600"
        - create: time_entries
          values:
            work_order: record
            technician: user
            minutes: params.minutes
            logged_at: now
            note: params.note

  - change_action:
      entity: work_orders
      name: complete
      params:
        resolution: {type: text, required: true}
      guard: "record.status == 'in_progress' and count(time_entries, work_order=record) > 0"
      guard_message: "'only an order in progress with at least one time entry can be completed'"
      effects:
        - set: {status: "'completed'", completed_at: now, resolution: params.resolution}
        - emit: work_completed
          payload: {work_order: record, asset: record.asset, technician: record.assignee, labor_minutes: record.labor_minutes, parts_cost: record.parts_cost}

