name: tests

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install . pytest==8.4.2
      - run: python -m pytest -q
      - name: CLI smoke test
        run: |
          printf 'Date,Value\n01/01/2020,1\n01/02/2020,2\n01/03/2020,3\n01/04/2020,4\n01/05/2020,5\n01/06/2020,6\n01/07/2020,7\n01/08/2020,8\n01/09/2020,9\n01/10/2020,10\n01/11/2020,11\n01/12/2020,12\n01/01/2021,13\n01/02/2021,14\n' > smoke.csv
          dmguard check smoke.csv

  javascript-parity:
    # The in-browser version (web/dmguard.js) must give the same verdicts as the Python tool.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -r requirements-bench.txt
      - run: python bench/fetch_data.py
      - run: python demo/make_demo_data.py
      - run: python web/parity_check.py
