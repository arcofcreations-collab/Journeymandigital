[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dmguard"
version = "1.0.0"
description = "Resolve day-first vs month-first numeric dates from a column's calendar structure, abstaining when unsure"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "dmguard contributors" }]
keywords = ["dates", "date-parsing", "csv", "data-cleaning", "data-quality", "dayfirst", "locale", "ambiguous-dates", "time-series"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Utilities",
]
dependencies = []  # standard library only

[project.urls]
Homepage = "https://github.com/arcofcreations-collab/Journeymandigital"
Source = "https://github.com/arcofcreations-collab/Journeymandigital"
Issues = "https://github.com/arcofcreations-collab/Journeymandigital/issues"
Changelog = "https://github.com/arcofcreations-collab/Journeymandigital/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = ["pytest==8.4.2"]
bench = ["pandas==3.0.6", "duckdb==1.5.6", "numpy==2.4.6"]

[project.scripts]
dmguard = "dmguard.cli:main"

[tool.setuptools]
packages = ["dmguard"]
