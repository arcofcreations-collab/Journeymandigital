[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dmguard"
version = "1.0.0"
description = "Resolve day-first vs month-first numeric dates from a column's calendar structure, abstaining when unsure"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []  # standard library only

[project.optional-dependencies]
test = ["pytest==8.4.2"]
bench = ["pandas==3.0.6", "duckdb==1.5.6", "numpy==2.4.6"]

[project.scripts]
dmguard = "dmguard.cli:main"

[tool.setuptools]
packages = ["dmguard"]
