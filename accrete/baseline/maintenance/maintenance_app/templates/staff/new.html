{% extends "base.html" %}
{% block title %}New staff member{% endblock %}
{% block content %}
<h1>New staff member</h1>
<form data-create="staff" method="post" action="{{ url_for('ui.create_staff') }}">
  <label>Username <input name="username" required></label>
  <label>Name <input name="name" required></label>
  <label>Role
    <select name="role">
      {% for role in roles %}<option value="{{ role }}">{{ role }}</option>{% endfor %}
    </select>
  </label>
  <label>Site <input name="site" required></label>
  <label>Active
    <select name="active">
      <option value="true" selected>yes</option>
      <option value="false">no</option>
    </select>
  </label>
  <button type="submit">Create</button>
</form>
{% endblock %}
