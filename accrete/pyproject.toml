[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "accrete"
version = "0.1.0"
description = "Applications as ledgers of typed, invertible, verified changes"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6"]

[project.scripts]
accrete = "accrete.cli:main"

[tool.setuptools]
packages = ["accrete"]
