{% extends "base.html" %}
{% block title %}New work order{% endblock %}
{% block content %}
<h1>New work order</h1>
<form data-create="work_orders" method="post" action="{{ url_for('ui.create_work_order') }}">
  <label>Asset
    <select name="asset" required>
      {% for asset in assets %}<option value="{{ asset.id }}">{{ asset.tag }} · {{ asset.name }} ({{ asset.site }})</option>{% endfor %}
    </select>
  </label>
  <label>Title <input name="title" required></label>
  <label>Description <textarea name="description"></textarea></label>
  <label>Priority
    <select name="priority">
      {% for priority in priorities %}<option value="{{ priority }}"{% if priority == "normal" %} selected{% endif %}>{{ priority }}</option>{% endfor %}
    </select>
  </label>
  <button type="submit">Create</button>
</form>
{% endblock %}
