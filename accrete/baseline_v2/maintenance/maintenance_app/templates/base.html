<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% block title %}Maintenance{% endblock %} · Maintenance work orders</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem; color: #222; }
    nav a { margin-right: 1rem; }
    table { border-collapse: collapse; margin: 1rem 0; }
    th, td { border-bottom: 1px solid #ddd; padding: .3rem .6rem; text-align: left; }
    dl { display: grid; grid-template-columns: max-content auto; gap: .3rem 1rem; }
    dt { font-weight: bold; }
    form { margin: 1rem 0; }
    label { display: block; margin: .4rem 0; }
    .error { color: #a00; }
  </style>
</head>
<body>
  <nav>
    <a href="{{ url_for('ui.list_work_orders') }}">Work orders</a>
    <a href="{{ url_for('ui.list_assets') }}">Assets</a>
    <a href="{{ url_for('ui.list_staff') }}">Staff</a>
    {% if ctx %}<span>Signed in as {{ ctx.user.username }} ({{ ctx.user.role }}, {{ ctx.user.site }})</span>{% endif %}
  </nav>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
