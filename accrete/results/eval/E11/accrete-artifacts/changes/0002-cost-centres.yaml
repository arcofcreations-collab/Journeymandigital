request: "Cost centres with budgets (expenses). Every claim is charged to a cost centre, and managers may not approve beyond a cost centre's budget."
interpretation: >
  New entity cost_centres (code, name, department unique among non-null, budget >= 0, computed
  committed/remaining); readable by all, writable by finance only. PATCHing budget below committed
  is a 409 (update_guard); deleting a cost centre with claims is a 409 (delete_guard). Claims get a
  required cost_centre reference defaulting to the cost centre of the creator's department, editable
  by the employee while draft. approve's guard additionally requires committed + amount <= budget
  (rounded to cents). The payment payload gains cost_centre. Seed 4 cost centres; existing claims
  are backfilled from their employee's department.
ops:
  - add_entity:
      name: cost_centres
      display: code
      fields:
        code: text required unique
        name: text required
        department: text unique
        budget: number required
        committed: {type: number, computed: "round(sum(c.amount for c in claims if c.cost_centre == record and c.status in ('approved', 'paid')), 2)"}
        remaining: {type: number, computed: "round(record.budget - round(sum(c.amount for c in claims if c.cost_centre == record and c.status in ('approved', 'paid')), 2), 2)"}
      rules:
        read: "True"
        create: "user.role == 'finance'"
        update: "user.role == 'finance'"
        delete: "user.role == 'finance'"
        delete_guard: "count(claims, cost_centre=record) == 0"
      triggers:
        budget_not_below_committed:
          on: update
          effects:
            - {fail: "'budget cannot be lower than the committed amount'", status: 409, when: "record.budget >= 0 and round(record.budget, 2) < record.committed"}
      constraints:
        budget_non_negative: {expr: "record.budget >= 0", message: "must be at least 0", field: budget}
  - add_records:
      entity: cost_centres
      records:
        - {id: 1, code: ENG, name: Engineering, department: Engineering, budget: 31000.00}
        - {id: 2, code: SAL, name: Sales, department: Sales, budget: 12000.00}
        - {id: 3, code: FIN, name: Finance, department: Finance, budget: 2000.00}
        - {id: 4, code: TRV, name: Travel pool, department: null, budget: 5000.00}
  - add_field:
      entity: claims
      name: cost_centre
      type: ref
      ref: cost_centres
      required: true
      default: "first(cost_centres, department=user.department)"
      backfill: "first(cost_centres, department=record.employee.department)"
  - change_action:
      entity: claims
      name: approve
      guard: "record.status == 'submitted' and round(record.cost_centre.committed + record.amount, 2) <= round(record.cost_centre.budget, 2)"
  - change_action:
      entity: claims
      name: pay
      effects:
        - set: {status: "'paid'"}
        - emit: payment
          payload: {claim: record, employee: record.employee, amount: record.amount, cost_centre: record.cost_centre}
expect:
