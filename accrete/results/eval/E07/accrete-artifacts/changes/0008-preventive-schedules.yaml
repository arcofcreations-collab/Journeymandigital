request: "Preventive maintenance schedules (maintenance, applied after E06)"
interpretation: >-
  New entity schedules (asset ref required and immutable, title non-empty text, priority p1-p4,
  interval_days JSON integer 1-365, next_due real date, active bool default true). Everyone reads
  all schedules. Create/PATCH/DELETE: managers, or supervisors whose site equals the site of the
  schedule's asset (create: an unknown/missing asset is left to the 400 check, an existing asset of
  another site is 403 before any 400). Create on a retired asset -> 400; p4 on a high-criticality
  asset -> 400 on create and on any PATCH that sends priority p4 (as for work orders); sending asset
  on PATCH -> 400. Work orders gain a system field schedule (ref schedules, null for all existing
  orders); because it is referenced, deleting a schedule that generated an order is 409, and
  deleting an asset that has a schedule is 409. Action schedules.generate: allow = manager or
  own-site supervisor (403); guard = active, asset not retired, no unfinished order generated by
  this schedule, today >= next_due - 7 days (409); effects atomically create the work order
  (asset, title, description 'Preventive maintenance', priority, status open, requested_by caller,
  created_at now, schedule), emit preventive_generated {schedule, work_order, next_due (new)}, and
  advance next_due by interval_days exactly once. Retiring an asset (PATCH sending retired true)
  sets active=false on all its schedules in the same update; un-retiring does not reactivate them.
  The five given schedules are created with ids 1-5.
ops:
  - add_entity:
      name: schedules
      fields:
        asset: ref assets required
        title: text required
        priority: enum p1|p2|p3|p4 required
        interval_days: int required
        next_due: date required
        active: {type: bool, default: "True"}
      rules:
        read: "True"
        create: "user.role == 'manager' or (user.role == 'supervisor' and (record.asset is None or record.asset.site == user.site))"
        update: "user.role == 'manager' or (user.role == 'supervisor' and record.asset.site == user.site)"
        delete: "user.role == 'manager' or (user.role == 'supervisor' and record.asset.site == user.site)"
      constraints:
        title_nonempty: {expr: "record.title is None or record.title.strip() != ''", message: "must be non-empty text", field: title}
        interval_days_range: {expr: "record.interval_days is None or (record.interval_days >= 1 and record.interval_days <= 365)", message: "must be an integer from 1 to 365", field: interval_days}
      triggers:
        reject_retired_asset:
          on: create
          effects:
            - {fail: "'asset is retired'", status: 400, when: "record.asset is not None and record.asset.retired"}
        no_p4_on_high_criticality_create:
          on: create
          effects:
            - {fail: "'priority p4 is not allowed for a high-criticality asset'", status: 400, when: "record.priority == 'p4' and record.asset is not None and record.asset.criticality == 'high'"}
        asset_is_fixed:
          on: update
          effects:
            - {fail: "'asset cannot be changed'", status: 400, when: "'asset' in input"}
        no_p4_on_high_criticality_update:
          on: update
          effects:
            - {fail: "'priority p4 is not allowed for a high-criticality asset'", status: 400, when: "'priority' in input and record.priority == 'p4' and record.asset.criticality == 'high'"}

  - add_records:
      entity: schedules
      records:
        - {id: 1, asset: 3, title: "Boiler annual service", priority: p2, interval_days: 365, next_due: "2026-03-05", active: true}
        - {id: 2, asset: 16, title: "Conveyor belt inspection", priority: p3, interval_days: 30, next_due: "2026-03-20", active: true}
        - {id: 3, asset: 30, title: "Generator load test", priority: p3, interval_days: 90, next_due: "2026-02-01", active: false}
        - {id: 4, asset: 25, title: "Filter replacement", priority: p4, interval_days: 60, next_due: "2026-02-15", active: true}
        - {id: 5, asset: 21, title: "Generator monthly run", priority: p2, interval_days: 30, next_due: "2026-03-03", active: true}

  - add_field: {entity: work_orders, name: schedule, type: ref, ref: schedules, system: true, backfill: "None"}

  - add_action:
      entity: schedules
      name: generate
      allow: "user.role == 'manager' or (user.role == 'supervisor' and record.asset.site == user.site)"
      guard: >-
        record.active and not record.asset.retired
        and count([w for w in work_orders if w.schedule == record and w.status in ['open', 'assigned', 'in_progress']]) == 0
        and today >= record.next_due - days(7)
      guard_message: "'schedule is inactive, its asset is retired, an unfinished generated order exists, or it is not due yet'"
      effects:
        - create: work_orders
          values:
            asset: "record.asset"
            title: "record.title"
            description: "'Preventive maintenance'"
            priority: "record.priority"
            status: "'open'"
            requested_by: "user"
            created_at: "now"
            assignee: "None"
            schedule: "record"
          as: wo
        - {emit: preventive_generated, payload: {schedule: "record", work_order: "wo", next_due: "record.next_due + days(record.interval_days)"}}
        - {set: {next_due: "record.next_due + days(record.interval_days)"}}

  - add_trigger:
      entity: assets
      name: retire_deactivates_schedules
      on: update
      when: "'retired' in input and input['retired'] is True"
      effects:
        - {update: "find(schedules, asset=record)", set: {active: "False"}}

