request: "Approval delegation: managers can delegate their approval duties to another manager for a date range (delegations collection; active delegates may read, approve and reject claims of the delegator's direct reports; no self-approval; no chaining)."
interpretation: >
  New entity delegations (delegator = creator, system; delegate required ref employees; starts_on/ends_on
  required dates). Create only by managers (403); delegate must be another manager (400, constraint);
  ends_on >= starts_on (400, constraint). Read by delegator, delegate or finance; delete only by delegator;
  update forbidden for everyone. A delegation is active when starts_on <= today <= ends_on (today from X-Now).
  Claims read/approve/reject additionally allowed to a user who is the delegate of an active delegation whose
  delegator is the claim employee's direct manager (no chaining since only the direct manager's own
  delegations count). approve/reject are never allowed on one's own claim (403). State guards unchanged.
ops:
  - add_entity:
      name: delegations
      fields:
        delegator: {type: ref, ref: employees, required: true, system: true, default: user}
        delegate: {type: ref, ref: employees, required: true}
        starts_on: {type: date, required: true}
        ends_on: {type: date, required: true}
      rules:
        read: "record.delegator == user or record.delegate == user or user.role == 'finance'"
        create: "user.role == 'manager'"
        update: "False"
        delete: "record.delegator == user"
      constraints:
        delegate_is_other_manager:
          expr: "record.delegate != record.delegator and record.delegate.role == 'manager'"
          message: "the delegate must be another employee with role manager"
          field: delegate
        ends_not_before_starts:
          expr: "record.ends_on >= record.starts_on"
          message: "ends_on must not be before starts_on"
          field: ends_on
  - set_rule:
      entity: claims
      rule: read
      expr: "record.employee == user or record.employee.manager == user or user.role == 'finance' or any(d.delegate == user and d.delegator == record.employee.manager and d.starts_on <= today and today <= d.ends_on for d in delegations)"
  - change_action:
      entity: claims
      name: approve
      allow: "record.employee != user and (record.employee.manager == user or any(d.delegate == user and d.delegator == record.employee.manager and d.starts_on <= today and today <= d.ends_on for d in delegations))"
  - change_action:
      entity: claims
      name: reject
      allow: "record.employee != user and (record.employee.manager == user or any(d.delegate == user and d.delegator == record.employee.manager and d.starts_on <= today and today <= d.ends_on for d in delegations))"
